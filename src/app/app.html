<style>
  :host {
    display: block;
  }

  .layout-shell {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }

  .sidebar-backdrop {
    display: none;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .menu-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #ec4899, #a855f7);
    color: #fff;
    font-weight: 800;
    padding: 10px 12px;
  }

  .desktop-hide {
    display: none;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  @media (max-width: 900px) {
    .layout-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: min(88vw, 320px);
      transform: translateX(-105%);
      transition: transform 0.25s ease;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(28, 18, 40, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    .sidebar-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-toggle {
      display: inline-grid;
      place-items: center;
    }

    .desktop-hide {
      display: inline-grid;
    }

    .topbar {
      padding: 18px 16px;
    }

    .workspace {
      padding: 16px;
    }

    .topbar-actions {
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hero-card,
    .panel,
    .router-card {
      border-radius: 20px;
    }

    .hero-card {
      padding: 18px;
    }

    .search-row,
    .topbar {
      flex-direction: column;
      align-items: stretch;
    }

    .search-row button,
    .search-row input,
    .logout-button,
    .date-pill {
      width: 100%;
    }

    .quick-actions {
      grid-template-columns: 1fr !important;
    }
  }

  @media (max-width: 520px) {
    .brand-subtitle,
    .breadcrumb {
      font-size: 0.82rem;
    }

    .hero-copy h1 {
      font-size: 1.45rem;
    }
  }
</style>

<div class="layout-shell" [class.sidebar-collapsed]="!isSidebarOpen" (touchstart)="startSidebarSwipe($event)" (touchend)="endSidebarSwipe($event)" (keydown.escape)="closeSidebar()">
  <div class="sidebar-backdrop" [class.visible]="isSidebarOpen" (click)="closeSidebar()"></div>

  <aside id="module-navigation" class="sidebar" [class.open]="isSidebarOpen" [attr.inert]="isSidebarOpen ? null : ''" [attr.aria-hidden]="!isSidebarOpen">
    <div class="brand-row">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="Sitio 580 A.C.">
      </div>
    </div>

    <nav class="nav" aria-label="Módulos">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      Operando en local
    </div>
  </aside>

  <button class="sidebar-arrow" [class.is-closed]="!isSidebarOpen" type="button" (click)="toggleSidebar()" aria-controls="module-navigation" [attr.aria-expanded]="isSidebarOpen" [attr.aria-label]="isSidebarOpen ? 'Ocultar módulos' : 'Mostrar módulos'" [title]="isSidebarOpen ? 'Ocultar módulos' : 'Mostrar módulos'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
  </button>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle mobile-menu-toggle" type="button" (click)="toggleSidebar()" aria-controls="module-navigation" [attr.aria-expanded]="isSidebarOpen">
          <span aria-hidden="true">☰</span>
          Módulos
        </button>
        <div>
          <div class="welcome">Bienvenido(a): {{ userName }}</div>
          <div class="breadcrumb">base580</div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="date-pill">{{ currentDate }}</div>
        <button class="logout-button" type="button">Salir</button>
      </div>
    </header>

    <main class="workspace">
      <section class="router-card">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
